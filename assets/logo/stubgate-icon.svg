<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Stubgate icon">
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#111827"/>
  <!-- client node (hollow) -->
  <circle cx="26" cy="64" r="9" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <!-- line to the gate -->
  <path d="M36 64 H51" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- intercept gate (diamond) -->
  <rect x="53" y="53" width="22" height="22" rx="4" transform="rotate(45 64 64)" fill="#2DD4BF"/>
  <!-- line after the gate -->
  <path d="M77 64 H92" stroke="#2DD4BF" stroke-width="6" stroke-linecap="round"/>
  <!-- server node (filled) -->
  <circle cx="102" cy="64" r="9" fill="#2DD4BF"/>
</svg>
